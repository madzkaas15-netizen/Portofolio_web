<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>MyFinansial</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: sidebar nav on wide screens, bottom tab bar on phones; one content column of panels. Palette: deep ink + teal accent, copper for spending. */
:root{
  --bg:#f2f5f5;--panel:#ffffff;--panel-2:#e8eeee;--fg:#0f1b1d;--fg-2:#425254;--muted:#6a797b;--line:#d9e1e1;
  --accent:#0d7a72;--btn:#0b6b64;--btn-fg:#ffffff;--soft:#dff1ef;
  --in:#0d7a72;--out:#c4571f;
  --s1:#0d7a72;--s2:#c4571f;--s3:#3b6fd1;--s4:#c28a00;--s5:#c2548a;--s6:#5a8f2a;--s7:#6a55c9;--s8:#c93f3f;
  --ok:#0a6b2a;--ok-bg:#dff3e3;--warn:#6b4a00;--warn-bg:#fbeec6;--bad:#9f2222;--bad-bg:#fadcdc;
  --f-head:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1213;--panel:#121b1d;--panel-2:#1a2527;--fg:#e9f1f1;--fg-2:#b4c3c4;--muted:#85989a;--line:#233033;
  --accent:#2fb5a9;--btn:#1f9488;--btn-fg:#04201d;--soft:#0f2b29;--in:#2fb5a9;--out:#ee8a53;
  --s1:#2fb5a9;--s2:#ee8a53;--s3:#6f9bf0;--s4:#e0ad2c;--s5:#e27fb0;--s6:#8cc152;--s7:#9d8cf0;--s8:#ee7676;
  --ok:#6fd48a;--ok-bg:#10301a;--warn:#f0c463;--warn-bg:#3a2d0c;--bad:#f39a9a;--bad-bg:#3b1717;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1213;--panel:#121b1d;--panel-2:#1a2527;--fg:#e9f1f1;--fg-2:#b4c3c4;--muted:#85989a;--line:#233033;
  --accent:#2fb5a9;--btn:#1f9488;--btn-fg:#04201d;--soft:#0f2b29;--in:#2fb5a9;--out:#ee8a53;
  --s1:#2fb5a9;--s2:#ee8a53;--s3:#6f9bf0;--s4:#e0ad2c;--s5:#e27fb0;--s6:#8cc152;--s7:#9d8cf0;--s8:#ee7676;
  --ok:#6fd48a;--ok-bg:#10301a;--warn:#f0c463;--warn-bg:#3a2d0c;--bad:#f39a9a;--bad-bg:#3b1717;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 24px}
h1,h2,h3{font-family:var(--f-head);margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:210px minmax(0,1fr);gap:24px;padding-top:16px}
.side{position:sticky;top:16px;align-self:start;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.logo{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center;flex:none}
.logo::after{content:"";width:13px;height:13px;border-radius:50%;border:3px solid var(--bg);border-right-color:transparent;transform:rotate(-30deg)}
.brand h1{font-size:20px;letter-spacing:-.02em}
.nav{display:flex;flex-direction:column;gap:2px}
.nb{display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:9px;padding:10px 12px;color:var(--fg-2);font-weight:500;text-align:left;width:100%}
.nb svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nb[aria-current="page"]{background:var(--soft);color:var(--accent);font-weight:600}
.nb:hover{background:var(--panel-2)}
.main{min-width:0;display:flex;flex-direction:column;gap:16px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.bar h2{font-size:22px;letter-spacing:-.01em}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg-2);min-width:0}
.av{width:26px;height:26px;border-radius:50%;background:var(--btn);color:var(--btn-fg);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.em{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}
.monthbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.monthbar h3{font-size:16px;min-width:130px;text-align:center}
.ib{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:17px;line-height:1}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.panel h3{font-size:16px;margin-bottom:12px}
.panel h3 small{font:400 13px var(--f-body);color:var(--muted);margin-left:6px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px}
.hero{display:flex;flex-direction:column;gap:14px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.lbl{font-size:13px;color:var(--muted)}
.big{font:700 34px/1.1 var(--f-head);letter-spacing:-.02em}
.big.neg{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;border-top:1px solid var(--line);padding-top:14px}
.stat .val{font:600 18px var(--f-head);margin-top:2px}
.stat .lbl{display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.btn{background:var(--btn);color:var(--btn-fg);border:0;border-radius:9px;padding:9px 16px;font-weight:600}
.btn.ghost{background:var(--panel);color:var(--fg);border:1px solid var(--line);font-weight:500}
.btn.small{padding:6px 11px;font-size:13px}
.btn.danger{background:var(--bad);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--fg-2);margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.ax{fill:var(--muted);font:11px var(--f-body)}
.grid{stroke:var(--line);stroke-width:1}
.base{stroke:var(--muted);stroke-width:1;opacity:.5}
.tip{position:absolute;top:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.45;white-space:nowrap;z-index:5}
.tip b{display:block}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-size:14px;white-space:nowrap}
th{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.note{white-space:normal;min-width:130px;color:var(--fg-2)}
tbody tr:hover{background:var(--panel-2)}
.tid{font:500 12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);background:var(--panel-2);border-radius:6px;padding:2px 7px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.catrow{display:grid;grid-template-columns:minmax(70px,110px) 1fr auto;align-items:center;gap:10px;padding:6px 0;font-size:14px}
.catrow .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catrow .val{font-variant-numeric:tabular-nums;color:var(--fg-2);font-size:13px;text-align:right}
.track{background:var(--panel-2);border-radius:5px;height:12px;overflow:hidden}
.track i{display:block;height:100%;border-radius:0 4px 4px 0}
.bud{padding:10px 0;border-bottom:1px solid var(--line)}
.bud:last-child{border-bottom:0}
.bud-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bud-h b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bud-f{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--fg-2);margin-top:6px;flex-wrap:wrap}
.meter{background:var(--panel-2);border-radius:6px;height:10px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:0 5px 5px 0}
.pill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.recent{list-style:none;margin:0;padding:0}
.recent li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.recent li:last-child{border-bottom:0}
.sub{color:var(--muted);font-size:12.5px}
.amt{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.amt.in{color:var(--in)}.amt.out{color:var(--out)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px;background:var(--soft)}
.empty p{margin:0;color:var(--fg-2)}
.banner{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:13.5px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;align-items:end}
.form .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--fg-2);font-weight:500}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%;min-width:0}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--bg);padding:9px;font-weight:500;color:var(--fg-2)}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btn-fg);font-weight:600}
.err{color:var(--bad);font-size:13px;min-height:1em}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.calc button{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:10px 0;font:600 16px var(--f-head)}
.calc button.op{background:var(--soft);color:var(--accent)}
.calc button.eq{background:var(--btn);color:var(--btn-fg);border-color:transparent}
.calcres{font:600 13px var(--f-body);color:var(--accent);min-height:1.2em}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.alloc{display:flex;gap:2px;height:34px;margin:6px 0 14px}
.alloc div{min-width:3px;display:grid;place-items:center;font-size:12px;font-weight:600;color:#fff;border-radius:4px;overflow:hidden}
.alloc div.free{background:var(--panel-2);color:var(--muted);border:1px dashed var(--line)}
.pot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
.pot .nm{flex:1 1 140px}.pot .pc{width:84px;flex:none}
.pot .nom{flex:1 1 120px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.acc{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}
.acc:last-child{border-bottom:0}
.acc b{display:block}
.donutwrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donutwrap svg{width:170px;height:170px;flex:none}
.hint{font-size:13px;color:var(--muted);margin:10px 0 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:90vw}
.login{max-width:440px;margin:8vh auto 0;display:flex;flex-direction:column;gap:14px}
.login form{display:flex;flex-direction:column;gap:12px}
.login p{margin:0;color:var(--fg-2)}
.search{max-width:320px}
.av{overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.big{width:84px;height:84px;font-size:34px}
.profhead{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.subtabs button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 14px;font-weight:500;color:var(--fg-2);white-space:nowrap}
.subtabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:16px 0 4px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.gbtn{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:12px;min-height:44px}
.gfake{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:320px;padding:10px 16px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-weight:500}
.gfake:hover{background:var(--panel-2)}
.guide details{border-bottom:1px solid var(--line)}
.guide details:last-child{border-bottom:0}
.guide summary{cursor:pointer;padding:13px 2px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px;align-items:center}
.guide summary::-webkit-details-marker{display:none}
.guide summary::after{content:"+";font:500 20px var(--f-head);color:var(--muted);flex:none}
.guide details[open] summary::after{content:"\2212"}
.guide .gb{padding:0 2px 14px;color:var(--fg-2);max-width:70ch}
.guide .gb p{margin:0 0 8px}
.guide .gb ol,.guide .gb ul{margin:0 0 8px;padding-left:20px}
.guide .gb li{margin-bottom:4px}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);gap:12px;padding-bottom:84px}
  .side{position:static}
  .brand{padding:0}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:50;flex-direction:row;justify-content:space-around;background:var(--panel);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));gap:0}
  .nb{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 2px;text-align:center;justify-content:center;align-items:center}
  .nb span{white-space:nowrap}
  .big{font-size:29px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="login" hidden></div>
<div class="app" id="app" hidden>
  <aside class="side">
    <div class="brand"><span class="logo" aria-hidden="true"></span><h1>MyFinansial</h1></div>
    <nav class="nav" id="nav" aria-label="Menu"></nav>
  </aside>
  <main class="main">
    <div class="bar">
      <h2 id="title"></h2>
      <div class="who" id="who"></div>
    </div>
    <div class="monthbar" id="monthbar">
      <button class="ib" data-act="prev" aria-label="prev">&#8249;</button>
      <h3 id="monthlabel"></h3>
      <button class="ib" data-act="next" aria-label="next">&#8250;</button>
      <button class="btn ghost small" data-act="thismonth" id="thismonthbtn"></button>
    </div>
    <div id="view" style="display:flex;flex-direction:column;gap:16px"></div>
  </main>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<input type="file" id="restorefile" accept=".json,application/json" hidden>
<input type="file" id="avatarfile" accept="image/*" hidden>
<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
var $$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s))};
function pad(n,w){return String(n).padStart(w||2,"0")}
function okAvatar(a){return typeof a==="string"&&((a.length<150000&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(a))||/^https:\/\/[a-z0-9.-]+\.googleusercontent\.com\/[^\s"'<>]*$/.test(a))}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function todayStr(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function ym(d){return String(d).slice(0,7)}
function shiftMonth(m,k){var d=new Date(+m.slice(0,4),+m.slice(5)-1+k,1);return d.getFullYear()+"-"+pad(d.getMonth()+1)}

/* ---------- Bahasa: L(id, en) ---------- */
var MID=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
var MEN=["January","February","March","April","May","June","July","August","September","October","November","December"];
var SID=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
var SEN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function isEn(){return S.data?S.data.settings.lang==="en":S.pre==="en"}

function shortM(m){return (isEn()?SEN:SID)[+m.slice(5)-1]}
function fmtDate(s){var p=s.split("-");return +p[2]+" "+(isEn()?SEN:SID)[+p[1]-1]}
function loc(){return isEn()?"en-US":"id-ID"}

/* ---------- Mata uang ---------- */
var CUR={IDR:["Rupiah","Rp"],USD:["US Dollar","$"],EUR:["Euro","€"],SGD:["Singapore Dollar","S$"],MYR:["Ringgit","RM"],JPY:["Yen","¥"],GBP:["Pound","£"],AUD:["Australian Dollar","A$"],SAR:["Saudi Riyal","SAR"],AED:["Dirham","AED"],CNY:["Yuan","CN¥"],KRW:["Won","₩"],THB:["Baht","฿"],EGP:["Egyptian Pound","E£"]};
var DEFRATES={IDR:1,USD:16300,EUR:17600,SGD:12100,MYR:3700,JPY:108,GBP:20700,AUD:10600,SAR:4350,AED:4440,CNY:2250,KRW:11.8,THB:460,EGP:330};
function sym(c){return (CUR[c]||[c,c])[1]}
function conv(a,from,to){var r=S.data.settings.rates;return a*(r[from]||1)/(r[to]||1)}
function money(n,c){c=c||S.data.settings.main;var dec=(c==="IDR"||c==="JPY"||c==="KRW")?0:2;
  var s=Math.abs(n).toLocaleString(loc(),{minimumFractionDigits:dec,maximumFractionDigits:dec});
  return (n<0?"− ":"")+sym(c)+"\u00a0"+s}
function main(n){return money(n,S.data.settings.main)}
function short(n){var a=Math.abs(n);function f(v){return v.toLocaleString(loc(),{maximumFractionDigits:1})}
  if(a>=1e12)return f(n/1e12)+(isEn()?"T":" T");if(a>=1e9)return f(n/1e9)+(isEn()?"B":" M");if(a>=1e6)return f(n/1e6)+(isEn()?"M":" jt");if(a>=1e3)return f(n/1e3)+(isEn()?"K":" rb");return String(Math.round(n*10)/10)}
function digits(s){return String(s||"").replace(/\D/g,"")}
function numIn(s){s=String(s||"").trim();if(!s)return NaN;
  /* terima 1.234,56 (id) atau 1,234.56 (en) */
  var en=isEn();s=en?s.replace(/,/g,""):s.replace(/\./g,"").replace(",",".");return Number(s)}
function fmtField(el){var en=isEn(),v=el.value;var keep=en?/[^\d.]/g:/[^\d,]/g;v=v.replace(keep,"");
  var sep=en?".":",",i=v.indexOf(sep),ip=i<0?v:v.slice(0,i),fp=i<0?"":sep+v.slice(i+1).replace(/[.,]/g,"");
  ip=ip?Number(ip).toLocaleString(loc()):"";el.value=ip+fp}

/* ---------- Kalkulator ekspresi aman ---------- */
function evalExpr(s){s=String(s||"").replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-").replace(/\s+/g,"");
  var en=isEn();s=en?s.replace(/,/g,""):s.replace(/\./g,"").replace(/,/g,".");
  if(!s||!/^[\d+\-*/().]+$/.test(s))return NaN;

function fillCats(){var sel=$("#f-cat");if(!sel)return;var keep=sel.value,c=catsFor(S.type);
  sel.innerHTML=c.map(function(x){return '<option value="'+esc(x)+'">'+esc(catLabel(x))+'</option>'}).join("");if(c.indexOf(keep)>=0)sel.value=keep}
function renderTxTable(){
  var q=S.q.trim().toLowerCase(),a=q?S.data.tx.slice():monthTx(S.month);
  if(S.fType!=="all")a=a.filter(function(t){return t.type===S.fType});
  if(q)a=a.filter(function(t){var ac=accById(t.acc);return (t.code+" "+t.note+" "+t.cat+" "+catLabel(t.cat)+" "+(ac?ac.name:"")+" "+t.date).toLowerCase().indexOf(q)>=0});
  a=sortedTx(a);
  $("#tx-count").textContent=a.length+" "+L("baris","rows")+(q?"":" · "+monthName(S.month));
  $("#txbody").innerHTML=a.length?a.map(function(t){var ac=accById(t.acc),same=t.cur===S.data.settings.main;
    var del=S.openDel===t.id?'<button class="btn small danger" data-del="'+esc(t.id)+'">'+L("Yakin hapus?","Delete?")+'</button>':'<button class="btn ghost small" data-del="'+esc(t.id)+'" aria-label="'+L("Hapus","Delete")+'">'+L("Hapus","Delete")+'</button>';
    return '<tr><td><span class="tid">'+esc(t.code)+'</span></td><td>'+fmtDate(t.date)+'</td><td><span class="tag"><i class="dot" style="background:'+(t.type==="in"?"var(--in)":"var(--out)")+'"></i>'+(t.type==="in"?L("Pemasukan","Income"):L("Pengeluaran","Expense"))+'</span></td><td>'+esc(catLabel(t.cat))+'</td><td class="note">'+esc(t.note)+(t.sample?' <span class="pill warn">'+L("contoh","sample")+'</span>':'')+'</td><td>'+esc(ac?ac.name:"-")+'</td><td class="num"><span class="amt '+t.type+'">'+(t.type==="in"?"+ ":"− ")+money(t.amount,t.cur)+'</span>'+(same?'':'<div class="sub">≈ '+main(inMain(t))+'</div>')+'</td><td>'+del+'</td></tr>'}).join(""):
   '<tr><td colspan="8" style="white-space:normal;color:var(--muted)">'+(q?L("Tidak ada transaksi yang cocok.","No matching transactions."):L("Belum ada transaksi di ","No transactions in ")+monthName(S.month))+'</td></tr>'}
function updCalcRes(){var el=$("#calcres"),f=$("#f-amount");if(!el||!f)return;var v=evalExpr(f.value);
  if(!f.value.trim()){el.textContent="";return}
  if(isNaN(v)){el.textContent=L("Hitungan belum valid","Calculation not valid yet");return}
  var cur=$("#f-cur").value,txt="= "+money(v,cur);if(cur!==S.data.settings.main)txt+="  ≈ "+main(conv(v,cur,S.data.settings.main));el.textContent=txt}
function keyPress(k){var f=$("#f-amount");if(!f)return;
  if(k==="C")f.value="";else if(k==="⌫")f.value=f.value.slice(0,-1);
  else if(k==="="){var v=evalExpr(f.value);if(!isNaN(v)){var dec=isEn()?".":",";f.value=String(Math.round(v*100)/100).replace(".",dec)}}
  else f.value+=k;
  updCalcRes();f.focus()}
function submitTx(e){e.preventDefault();var err=$("#f-err");err.textContent="";
  var amt=evalExpr($("#f-amount").value),date=$("#f-date").value;
  if(!(amt>0)){err.textContent=L("Isi jumlah lebih dari nol.","Enter an amount above zero.");return}
  if(!date){err.textContent=L("Pilih tanggal.","Pick a date.");return}
  amt=Math.round(amt*100)/100;
  var t={id:uid(),code:nextCode(S.type==="in"?"IN":"OUT",date,S.data.tx),date:date,type:S.type,amount:amt,cur:$("#f-cur").value,cat:$("#f-cat").value||"Lainnya",note:$("#f-note").value.trim(),acc:$("#f-acc").value};
  S.data.tx.push(t);persist();S.month=ym(date);S.q="";
  toast(L("Tercatat dengan ID ","Saved with ID ")+t.code);
  renderChrome();renderTx();var f=$("#f-amount");if(f)f.focus()}

/* ---------- Data contoh ---------- */
function sampleRows(){var rows=[],cm=todayStr().slice(0,7),td=new Date().getDate(),aid=S.data.accounts[0].id,mc=S.data.settings.main,mul=(mc==="IDR")?1:1/conv(1,mc,"IDR");
  function r(v){return Math.round(v*mul*100)/100}
  for(var k=-2;k<=0;k++){(function(k){var m=shiftMonth(cm,k),cap=k===0?td:28;
    function add(d,type,cat,note,amt){if(amt>0&&d<=cap)rows.push({id:uid(),code:"",date:m+"-"+pad(d),type:type,amount:r(amt),cur:mc,cat:cat,note:note,acc:aid,sample:true})}
    add(1,"in","Gaji","Gaji bulanan",8000000);add(2,"out","Kebutuhan","Sewa kos",2000000);add(3,"out","Tabungan","Transfer tabungan",1600000);
    add(5,"out","Kebutuhan","Belanja bulanan",k===-1?1150000:900000);add(8,"out","Kebutuhan","Listrik dan internet",450000);
    add(10,"out","Keinginan",k===-2?"Liburan akhir pekan":"Makan di luar",k===-2?600000:320000);add(14,"out","Kebutuhan","Transportasi",380000);
    add(18,"out","Keinginan","Langganan dan hiburan",k===0?180000:260000);add(21,"in","Bonus","Proyek sampingan",k===-1?1200000:0)})(k)}
  return rows}
function addSamples(){S.data.tx=S.data.tx.concat(sampleRows());assignCodes(S.data);
  if(!S.data.profile.salary){S.data.profile.salary=Math.round(8000000*(S.data.settings.main==="IDR"?1:1/conv(1,S.data.settings.main,"IDR"))*100)/100;S.data.profile.sampleSalary=true}
  persist();toast(L("Data contoh terisi","Sample data loaded"));render()}
function rmSamples(){S.data.tx=S.data.tx.filter(function(t){return !t.sample});
  if(S.data.profile.sampleSalary){S.data.profile.salary=0;delete S.data.profile.sampleSalary}
  persist();toast(L("Data contoh dihapus","Sample data removed"));render()}

var CRC=(function(){var t=[],c,n,k;for(n=0;n<256;n++){c=n;for(k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){var c=0xFFFFFFFF;for(var i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function utf8(s){return new TextEncoder().encode(s)}
function zipStore(files){var parts=[],cd=[],off=0;
  files.forEach(function(f){var nm=utf8(f.name),d=typeof f.data==="string"?utf8(f.data):f.data,crc=crc32(d);
    var h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,0,true);h.setUint16(12,33,true);
    h.setUint32(14,crc,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,nm.length,true);h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),nm,d);
    var c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,0,true);c.setUint16(14,33,true);
    c.setUint32(16,crc,true);c.setUint32(20,d.length,true);c.setUint32(24,d.length,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
    cd.push(new Uint8Array(c.buffer),nm);off+=30+nm.length+d.length});
  var cdLen=0;cd.forEach(function(x){cdLen+=x.length});
  var e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cdLen,true);e.setUint32(16,off,true);
  return new Blob(parts.concat(cd,[new Uint8Array(e.buffer)]),{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})}
function colName(i){var s="";i++;while(i>0){var m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s}
function xe(s){return String(s==null?"":s).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}

function buildXlsx(sheets){var NS='xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"',R='http://schemas.openxmlformats.org/officeDocument/2006/relationships',n=sheets.length;

   {name:"_rels/.rels",data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="'+R+'/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
   {name:"xl/workbook.xml",data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook '+NS+' xmlns:r="'+R+'"><sheets>'+sheets.map(function(s,i){return '<sheet name="'+xe(s.name.replace(/[\\\/?*\[\]:]/g," ").slice(0,31))+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>'}).join("")+'</sheets></workbook>'},
   {name:"xl/_rels/workbook.xml.rels",data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map(function(s,i){return '<Relationship Id="rId'+(i+1)+'" Type="'+R+'/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>'}).join("")+'<Relationship Id="rId'+(n+1)+'" Type="'+R+'/styles" Target="styles.xml"/></Relationships>'},
   {name:"xl/styles.xml",data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet '+NS+'><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>'}];
  sheets.forEach(function(s,i){var rows=s.rows.map(function(row,ri){return '<row r="'+(ri+1)+'">'+row.map(function(c,ci){if(c===null||c===undefined||c==="")return "";var ref=colName(ci)+(ri+1),st=ri===0&&s.header!==false?' s="1"':"";
      if(typeof c==="number")return '<c r="'+ref+'"'+st+'><v>'+c+'</v></c>';
      if(typeof c==="object")return '<c r="'+ref+'"><f>'+xe(c.f)+'</f><v>'+c.v+'</v></c>';
      return '<c r="'+ref+'" t="inlineStr"'+st+'><is><t xml:space="preserve">'+xe(c)+'</t></is></c>'}).join("")+'</row>'}).join("");
    var cols=(s.widths||[]).map(function(w,k){return '<col min="'+(k+1)+'" max="'+(k+1)+'" width="'+w+'" customWidth="1"/>'}).join("");
    files.push({name:"xl/worksheets/sheet"+(i+1)+".xml",data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet '+NS+'>'+(cols?'<cols>'+cols+'</cols>':'')+'<sheetData>'+rows+'</sheetData></worksheet>'})});
  return zipStore(files)}

/* PDF sederhana: A4, Helvetica. Teks di luar Latin-1 diganti "?". */
function pdfW(s,size){var w=0;for(var i=0;i<s.length;i++){var c=s.charAt(i);w+=/\d/.test(c)?.556:/[ .,:;'|\/!]/.test(c)?.278:c==="+"?.584:c==="-"?.333:/[A-Z]/.test(c)?.68:/[mw]/.test(c)?.78:.52}return w*size}
function PdfDoc(){this.pages=[[]]}
PdfDoc.prototype.add=function(){this.pages.push([])};
PdfDoc.prototype.text=function(x,y,str,size,bold,rgb){var s=String(str).replace(/[^ -ÿ]/g,"?").replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)"),c=rgb||[.1,.1,.1];
  this.pages[this.pages.length-1].push(c[0]+" "+c[1]+" "+c[2]+" rg BT /"+(bold?"F2":"F1")+" "+size+" Tf "+x.toFixed(2)+" "+(842-y).toFixed(2)+" Td ("+s+") Tj ET")};
PdfDoc.prototype.build=function(){var objs=[],self=this;
  objs[1]="<< /Type /Catalog /Pages 2 0 R >>";
  var kids=this.pages.map(function(p,i){return (5+i*2)+" 0 R"}).join(" ");
  objs[2]="<< /Type /Pages /Kids ["+kids+"] /Count "+this.pages.length+" >>";
  objs[3]="<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>";
  objs[4]="<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>";
  this.pages.forEach(function(p,i){var cs=p.join("\n"),pn=5+i*2;
    objs[pn]="<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents "+(pn+1)+" 0 R >>";
    objs[pn+1]="<< /Length "+cs.length+" >>\nstream\n"+cs+"\nendstream"});
  var out="%PDF-1.4\n",offs=[];for(var i=1;i<objs.length;i++){offs[i]=out.length;out+=i+" 0 obj\n"+objs[i]+"\nendobj\n"}
  var xr=out.length;out+="xref\n0 "+objs.length+"\n0000000000 65535 f \n";
  for(var j=1;j<objs.length;j++)out+=String(offs[j]).padStart(10,"0")+" 00000 n \n";
  out+="trailer\n<< /Size "+objs.length+" /Root 1 0 R >>\nstartxref\n"+xr+"\n%%EOF";
  var u=new Uint8Array(out.length);for(var k=0;k<out.length;k++)u[k]=out.charCodeAt(k)&255;return new Blob([u],{type:"application/pdf"})};

function pm(n,c){var dec=(c==="IDR"||c==="JPY"||c==="KRW")?0:2;return c+" "+Math.abs(n).toLocaleString(loc(),{minimumFractionDigits:dec,maximumFractionDigits:dec})}

  var s2=[["ID","Tanggal","Dari","Ke","Dikirim","Diterima","Keterangan"]].concat(D.transfers.map(function(t){var f=accById(t.from),to=accById(t.to);return [t.code,t.date,f?f.name:"",to?to.name:"",t.amt,t.amtTo,t.note]}));

function exportPdf(){var D=S.data,mc=D.settings.main,doc=new PdfDoc(),W=595,M=40,y=M+10,a=monthTx(S.month),inc=sumM(a,"in"),out=sumM(a,"out"),G=[.43,.43,.43],TEAL=[.05,.48,.45],COP=[.77,.34,.12];
  function T(x,txt,sz,b,c){doc.text(x,y,txt,sz,b,c)}

  function chk(h){if(y+h>800){doc.add();y=M+10}}
  T(M,"MyFinansial",20,true);y+=18;T(M,monthName(S.month)+"  |  "+S.email,10,false,G);y+=26;
  T(M,L("Ringkasan","Summary"),13,true);y+=18;
  [[L("Pemasukan","Income"),pm(inc,mc)],[L("Pengeluaran","Expenses"),pm(out,mc)],[L("Sisa","Net"),(inc-out<0?"-":"")+pm(inc-out,mc)]].forEach(function(r){T(M,r[0],11);R(r[1],11,true);y+=16});

  var cr=catRows(a);if(!cr.length){T(M,"-",11);y+=16}

  y+=12;chk(50);T(M,L("Transaksi","Transactions"),13,true);y+=18;
  var cx=[M,M+96,M+150,M+240];
  function head(){T(cx[0],"ID",9,true,G);T(cx[1],L("Tanggal","Date"),9,true,G);T(cx[2],L("Kategori","Category"),9,true,G);T(cx[3],L("Keterangan / Jumlah","Note / Amount"),9,true,G);y+=14}
  head();
  sortedTx(a).forEach(function(t){if(y>790){doc.add();y=M+10;head()}
    var amt=(t.type==="in"?"+ ":"- ")+pm(t.amount,t.cur),note=String(t.note||"");while(note.length>1&&pdfW(note,9)>W-M-cx[3]-pdfW(amt,9)-14)note=note.slice(0,-1);
    T(cx[0],t.code,9);T(cx[1],t.date,9);T(cx[2],catLabel(t.cat).slice(0,16),9);T(cx[3],note,9);R(amt,9,true,t.type==="in"?TEAL:COP);y+=14});
  if(!a.length)T(M,"-",10);
  var n=doc.pages.length;doc.pages.forEach(function(p,i){var s="MyFinansial · "+(i+1)+"/"+n;p.push("0.55 0.55 0.55 rg BT /F1 8 Tf "+(W/2-pdfW(s,8)/2).toFixed(2)+" 17 Td ("+s.replace(/[^ -ÿ]/g,"?")+") Tj ET")});
  saveFile("myfinansial-"+S.month+".pdf",doc.build())}

/* ---------- Pengaturan: profil, tampilan, panduan ---------- */
var GUIDE=[["Mulai: daftar dan masuk", "Getting started: sign up and sign in", "<ol><li>Pilih <b>Daftar</b>, isi email dan kata sandi (minimal 6 karakter), lalu tekan Buat akun.</li><li>Jika admin sudah mengaktifkan login Google, tekan tombol Google untuk masuk tanpa kata sandi.</li><li>Lain kali pilih <b>Masuk</b>. Untuk berganti akun, tekan <b>Ganti akun</b> di kanan atas.</li></ol><p>Jika halaman dibuka tanpa server, akun dan datamu hanya tersimpan di browser itu. Simpan cadangan secara berkala.</p>", "<ol><li>Choose <b>Sign up</b>, enter your email and a password (at least 6 characters), then press Create account.</li><li>If the admin has turned on Google sign-in, press the Google button to sign in without a password.</li><li>Next time choose <b>Sign in</b>. To change accounts, press <b>Switch account</b> at the top right.</li></ol><p>If the page is opened without a server, your account and data live only in that browser. Save a backup regularly.</p>"], ["Dasbor", "Dashboard", "<p>Dasbor merangkum satu bulan. Pakai tombol panah di atas untuk berpindah bulan, atau <b>Bulan ini</b> untuk kembali.</p><ul><li><b>Sisa</b>: pemasukan dikurangi pengeluaran bulan itu.</li><li><b>Rasio menabung</b>: bagian pemasukan yang tidak terpakai.</li><li><b>Tren 6 bulan</b>: sentuh atau arahkan kursor ke batang untuk melihat angkanya.</li><li><b>Diagram donat</b>: pengeluaran per kategori dalam persen.</li><li><b>Pantauan anggaran</b>: tiap pos gaji berstatus Aman, Hampir habis, atau Melebihi.</li></ul><p>Belum ada data? Tekan <b>Isi data contoh</b> untuk melihat contoh, lalu <b>Hapus data contoh</b> kapan saja.</p>", "<p>The dashboard summarizes one month. Use the arrows at the top to change month, or <b>This month</b> to come back.</p><ul><li><b>Net</b>: income minus expenses for that month.</li><li><b>Savings rate</b>: the share of income you did not spend.</li><li><b>6-month trend</b>: touch or hover a bar to see the numbers.</li><li><b>Donut chart</b>: expenses by category in percent.</li><li><b>Budget tracker</b>: each salary pot shows On track, Almost used, or Over.</li></ul><p>No data yet? Press <b>Load sample data</b> for a preview, then <b>Remove sample data</b> any time.</p>"], ["Mencatat transaksi dan kalkulator", "Adding transactions and the calculator", "<ol><li>Buka <b>Transaksi</b> dan pilih Pengeluaran atau Pemasukan.</li><li>Isi tanggal, jumlah, mata uang, rekening, kategori, dan keterangan.</li><li>Tekan <b>Tambah</b>.</li></ol><p>Kolom jumlah menerima hitungan, misalnya <b>45.000+12.500*2</b>. Hasilnya muncul di bawah kolom. Tombol <b>Buka kalkulator</b> menampilkan tombol angka untuk layar sentuh. Kamu bisa memakai + − × ÷ dan tanda kurung.</p>", "<ol><li>Open <b>Transactions</b> and choose Expense or Income.</li><li>Fill in the date, amount, currency, account, category and note.</li><li>Press <b>Add</b>.</li></ol><p>The amount field accepts calculations, for example <b>45,000+12,500*2</b>. The result shows under the field. <b>Open calculator</b> shows number keys for touch screens. You can use + − × ÷ and parentheses.</p>"], ["ID transaksi dan pencarian", "Transaction IDs and search", "<p>Setiap transaksi mendapat ID unik: <b>IN-</b> untuk pemasukan, <b>OUT-</b> untuk pengeluaran, <b>TF-</b> untuk transfer, diikuti tahun-bulan dan nomor urut, contohnya <b>OUT-202611-0003</b>.</p><ul><li>Ketik ID, keterangan, kategori, atau nama rekening di kolom cari pada tab Transaksi.</li><li>Saat kolom cari terisi, semua bulan ikut dicari.</li><li>Pakai filter jenis untuk hanya melihat pemasukan atau pengeluaran.</li><li>Untuk menghapus, tekan <b>Hapus</b> lalu <b>Yakin hapus?</b> sebagai konfirmasi.</li></ul>", "<p>Every transaction gets a unique ID: <b>IN-</b> for income, <b>OUT-</b> for expenses, <b>TF-</b> for transfers, followed by year-month and a running number, for example <b>OUT-202611-0003</b>.</p><ul><li>Type an ID, note, category or account name in the search box on the Transactions tab.</li><li>While the search box is filled, all months are searched.</li><li>Use the type filter to see only income or only expenses.</li><li>To delete, press <b>Delete</b> then <b>Delete?</b> to confirm.</li></ul>"], ["Bagi gaji ke beberapa pos", "Splitting your salary into pots", "<ol><li>Buka <b>Bagi Gaji</b> dan isi total gaji bulanan.</li><li>Pilih pola 50/30/20 atau Lima pos, atau atur pos sendiri.</li><li>Ubah nama dan persen tiap pos. Nominalnya dihitung otomatis. Totalnya sebaiknya 100%.</li><li>Tekan <b>Catat sebagai pemasukan bulan ini</b> untuk memasukkan gaji sebagai transaksi.</li></ol><p>Nama pos menjadi kategori pengeluaran, sehingga dasbor bisa memantau pemakaian tiap pos. Jika nama pos diganti, transaksi lama tetap memakai nama sebelumnya.</p>", "<ol><li>Open <b>Split</b> and enter your monthly salary.</li><li>Pick the 50/30/20 rule or Five pots, or set up your own pots.</li><li>Edit each pot's name and percent. The amount is calculated for you. The total should be 100%.</li><li>Press <b>Record as this month's income</b> to add the salary as a transaction.</li></ol><p>Pot names become expense categories, so the dashboard can track each pot. If you rename a pot, older transactions keep the previous name.</p>"], ["Rekening dan transfer", "Accounts and transfers", "<ul><li>Di <b>Rekening</b>, tambah rekening (mis. Bank, E-wallet, Tunai) dengan mata uang dan saldo awal.</li><li>Saldo tiap rekening mengikuti transaksi dan transfer.</li><li>Untuk transfer, pilih rekening asal dan tujuan lalu isi jumlah. Jika mata uangnya berbeda, jumlah diterima dihitung dari kurs dan bisa kamu ubah.</li><li>Rekening yang sudah dipakai transaksi atau transfer tidak bisa dihapus.</li></ul>", "<ul><li>In <b>Accounts</b>, add accounts (e.g. Bank, E-wallet, Cash) with a currency and opening balance.</li><li>Each balance follows your transactions and transfers.</li><li>For a transfer, pick the source and target account and enter the amount. If the currencies differ, the received amount is calculated from the rate and you can edit it.</li><li>An account that is used by transactions or transfers cannot be deleted.</li></ul>"], ["Mata uang dan kurs", "Currencies and exchange rates", "<p>Setiap transaksi punya mata uang sendiri (14 pilihan). Semua total, grafik, dan anggaran dihitung ke <b>mata uang utama</b>.</p><p>Atur mata uang utama dan kurs di Pengaturan, tab <b>Tampilan &amp; kurs</b>. Kurs awal hanya perkiraan dan tidak diperbarui otomatis, jadi sesuaikan dengan kurs yang kamu pakai.</p>", "<p>Each transaction has its own currency (14 to choose from). All totals, charts and budgets are calculated in your <b>main currency</b>.</p><p>Set the main currency and rates in Settings, on the <b>Display &amp; rates</b> tab. Default rates are approximate and do not update automatically, so adjust them to the rates you use.</p>"], ["Laporan dan unduhan", "Reports and downloads", "<p>Tab <b>Laporan</b> menampilkan grafik pemasukan dan pengeluaran 12 bulan, komposisi pengeluaran, dan tabel ringkasan bulanan.</p><ul><li><b>PDF</b>: ringkasan dan semua transaksi bulan yang dipilih, lengkap dengan ID.</li><li><b>Excel</b>: lima lembar (Transaksi, Transfer, Rekening, Ringkasan Bulanan, Pembagian Gaji) berisi semua bulan.</li><li><b>CSV</b>: semua transaksi, bisa dibuka di aplikasi spreadsheet apa pun.</li></ul><p>File dibuat di browsermu dan tersimpan di folder Unduhan.</p>", "<p>The <b>Reports</b> tab shows a 12-month income and expense chart, the expense mix, and a monthly summary table.</p><ul><li><b>PDF</b>: the summary and every transaction of the selected month, with IDs.</li><li><b>Excel</b>: five sheets (Transactions, Transfers, Accounts, Monthly summary, Salary split) covering all months.</li><li><b>CSV</b>: all transactions, openable in any spreadsheet app.</li></ul><p>Files are created in your browser and saved to your Downloads folder.</p>"], ["Profil dan pengaturan", "Profile and settings", "<p>Di <b>Pengaturan</b> ada tiga tab:</p><ul><li><b>Profil</b>: ganti nama dan foto, ganti kata sandi, cadangkan atau pulihkan data, dan keluar.</li><li><b>Tampilan &amp; kurs</b>: bahasa Indonesia atau Inggris, mata uang utama, mode terang, gelap, atau ikut perangkat, dan kurs.</li><li><b>Buku panduan</b>: halaman ini.</li></ul><p>Foto dikecilkan otomatis. Email tidak bisa diganti karena dipakai untuk masuk.</p>", "<p><b>Settings</b> has three tabs:</p><ul><li><b>Profile</b>: change your name and photo, change your password, back up or restore data, and sign out.</li><li><b>Display &amp; rates</b>: Indonesian or English, main currency, light, dark or follow-device mode, and rates.</li><li><b>User guide</b>: this page.</li></ul><p>Photos are resized automatically. Your email cannot be changed because it is used to sign in.</p>"], ["Cadangan dan pindah data", "Backups and moving your data", "<p>Cadangan adalah file JSON berisi semua datamu.</p><ul><li>Tekan <b>Cadangkan data</b> untuk mengunduhnya.</li><li>Tekan <b>Pulihkan dari cadangan</b> dan pilih file itu untuk menggabungkannya. Transaksi yang sudah ada tidak digandakan.</li></ul><p>Jika aplikasi dipakai tanpa server, cadangan adalah satu-satunya cara memindahkan data ke perangkat lain. Simpan salinannya secara berkala.</p>", "<p>A backup is a JSON file holding all your data.</p><ul><li>Press <b>Back up data</b> to download it.</li><li>Press <b>Restore from backup</b> and choose that file to merge it in. Existing transactions are not duplicated.</li></ul><p>If the app is used without a server, a backup is the only way to move data to another device. Keep a copy regularly.</p>"], ["Masalah umum", "Common problems", "<ul><li><b>Lupa kata sandi:</b> minta admin server menjalankan perintah resetpw. Jika kamu masuk dengan Google, tidak perlu kata sandi.</li><li><b>Data hilang saat dipakai tanpa server:</b> biasanya karena data browser dibersihkan. Pulihkan dari file cadangan.</li><li><b>Unduhan tidak muncul:</b> periksa apakah browser memblokir unduhan, lalu coba lagi.</li><li><b>Tampilan tidak berubah setelah pembaruan:</b> muat ulang paksa dengan Ctrl+Shift+R.</li></ul>", "<ul><li><b>Forgot your password:</b> ask the server admin to run the resetpw command. If you sign in with Google, you do not need a password.</li><li><b>Data missing when used without a server:</b> usually the browser data was cleared. Restore from a backup file.</li><li><b>Download does not appear:</b> check whether the browser blocked it, then try again.</li><li><b>Page looks unchanged after an update:</b> force reload with Ctrl+Shift+R.</li></ul>"]];
function rateVal(c){var r=S.data.settings.rates;return r[c]/r[S.data.settings.main]}
function fmtRate(v){return Number(v.toPrecision(6)).toLocaleString(loc(),{maximumFractionDigits:8})}
function dispName(){var m=S.data&&S.data.me;return (m&&m.name)||""}
function fillAv(el){el.textContent="";var m=S.data&&S.data.me;
  if(m&&okAvatar(m.avatar)){var im=document.createElement("img");im.alt="";im.src=m.avatar;el.appendChild(im)}
  else el.textContent=(dispName()||S.email||"?").charAt(0).toUpperCase()}
function pickAvatar(file){if(!file)return;
  if(!/^image\//.test(file.type)){toast(L("Pilih file gambar.","Choose an image file."));return}
  if(file.size>15*1024*1024){toast(L("Gambar terlalu besar (maks 15 MB).","Image too large (max 15 MB)."));return}
  var fr=new FileReader();
  fr.onload=function(){var im=new Image();
    im.onload=function(){var n=192,c=document.createElement("canvas");c.width=c.height=n;var x=c.getContext("2d"),s=Math.min(im.width,im.height);
      x.fillStyle="#fff";x.fillRect(0,0,n,n);x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,n,n);
      S.data.me.avatar=c.toDataURL("image/jpeg",.85);persist();renderChrome();renderSettings();toast(L("Foto profil diperbarui","Profile photo updated"))};
    im.onerror=function(){toast(L("Gambar tidak bisa dibaca.","Cannot read that image."))};im.src=fr.result};
  fr.readAsDataURL(file)}
function submitPw(e){e.preventDefault();var err=$("#pw-err");err.textContent="";
  var o=$("#pw-old")?$("#pw-old").value:"",n=$("#pw-new").value,n2=$("#pw-new2").value;
  if(n.length<6){err.textContent=L("Kata sandi baru minimal 6 karakter.","New password needs at least 6 characters.");return}
  if(n!==n2){err.textContent=L("Pengulangan kata sandi tidak sama.","The two new passwords do not match.");return}
  api("POST","/api/password",{old:o,new:n}).then(function(r){
    if(!r.ok){err.textContent=(r.json&&r.json.error)||L("Gagal mengganti kata sandi.","Could not change the password.");return}
    S.auth=S.auth||{};S.auth.hasPw=true;toast(L("Kata sandi disimpan","Password saved"));renderSettings()},
   function(){err.textContent=L("Server tidak terjangkau.","Cannot reach the server.")})}
function profilHtml(au){var me=S.data.me;
  return '<section class="panel"><h3>'+L("Edit profil","Edit profile")+'</h3><div class="profhead"><span class="av big" id="avbig"></span><div class="row"><button class="btn ghost small" type="button" data-act="pickavatar">'+L("Ganti foto","Change photo")+'</button>'+(me.avatar?'<button class="btn ghost small" type="button" data-act="rmavatar">'+L("Hapus foto","Remove photo")+'</button>':'')+'</div></div>'+
   '<div class="form"><label class="f">'+L("Nama","Name")+'<input type="text" id="p-name" maxlength="60" autocomplete="name" value="'+esc(me.name)+'" placeholder="'+L("Nama yang tampil di aplikasi","Name shown in the app")+'"></label><label class="f">Email<input type="text" value="'+esc(S.email)+'" disabled></label></div>'+
   '<p class="hint">'+(au.google?L("Akun ini terhubung dengan Google. ","This account is linked to Google. "):L("Email dipakai untuk masuk dan tidak bisa diganti di sini. ","Your email is used to sign in and cannot be changed here. "))+L("Foto dikecilkan otomatis dan disimpan bersama datamu.","Photos are resized automatically and saved with your data.")+'</p></section>'+
   '<section class="panel"><h3>'+(au.hasPw?L("Ganti kata sandi","Change password"):L("Buat kata sandi","Create a password"))+'</h3>'+
   (au.hasPw?'':'<p style="margin:0 0 12px;color:var(--fg-2)">'+L("Akunmu masuk lewat Google. Buat kata sandi agar kamu juga bisa masuk dengan email.","You sign in with Google. Create a password so you can also sign in with email.")+'</p>')+
   '<form class="form" id="pwform" autocomplete="off">'+(au.hasPw?'<label class="f">'+L("Kata sandi lama","Current password")+'<input type="password" id="pw-old" autocomplete="current-password" required></label>':'')+
   '<label class="f">'+L("Kata sandi baru","New password")+'<input type="password" id="pw-new" autocomplete="new-password" minlength="6" required></label><label class="f">'+L("Ulangi kata sandi baru","Repeat new password")+'<input type="password" id="pw-new2" autocomplete="new-password" minlength="6" required></label>'+
   '<div class="full row"><button class="btn" type="submit">'+L("Simpan kata sandi","Save password")+'</button><span class="err" id="pw-err" role="alert"></span></div></form>'+(LOCAL?'':'<p class="hint">'+L("Setelah diganti, perangkat lain keluar otomatis.","After changing it, your other devices are signed out.")+'</p>')+'</section>'+
   '<section class="panel"><h3>'+L("Data dan akun","Data and account")+'</h3><div class="row"><button class="btn ghost" data-act="backup">'+L("Cadangkan data","Back up data")+'</button><button class="btn ghost" data-act="restore">'+L("Pulihkan dari cadangan","Restore from backup")+'</button><button class="btn ghost" data-act="logout">'+L("Ganti akun","Switch account")+'</button></div><p class="hint">'+
   (LOCAL?L("Data tersimpan di browser ini, terpisah untuk tiap akun. Unduh cadangan JSON secara berkala dan pulihkan di perangkat lain.","Data is stored in this browser, separate for each account. Download a JSON backup regularly and restore it on another device."):L("Data tersimpan di database server dan ikut ke perangkat mana pun saat kamu masuk. Cadangan JSON berguna sebagai salinan pribadi.","Data lives in the server database and follows you to any device you sign in on. A JSON backup is handy as a personal copy."))+'</p></section>'}
function displayHtml(st,mc){
  var rr=Object.keys(CUR).map(function(c){return '<tr><td><b>'+c+'</b> <span class="sub">'+esc(CUR[c][0])+'</span></td><td class="num">1 '+c+' =</td><td style="width:150px">'+(c===mc?'<input type="text" value="1" disabled aria-label="'+c+'">':'<input type="text" inputmode="decimal" data-rate="'+c+'" value="'+fmtRate(rateVal(c))+'" aria-label="'+L("Kurs ","Rate ")+c+'">')+'</td><td>'+mc+'</td></tr>'}).join("");
  return '<section class="panel"><h3>'+L("Tampilan dan bahasa","Display and language")+'</h3><div class="form">'+
   '<label class="f">'+L("Bahasa","Language")+'<select id="s-lang"><option value="id"'+(st.lang==="id"?" selected":"")+'>Bahasa Indonesia</option><option value="en"'+(st.lang==="en"?" selected":"")+'>English</option></select></label>'+
   '<label class="f">'+L("Mata uang utama","Main currency")+'<select id="s-main">'+curOptions(mc)+'</select></label>'+
   '<label class="f">'+L("Mode tampilan","Theme")+'<select id="s-theme"><option value="system"'+(st.theme==="system"?" selected":"")+'>'+L("Ikuti perangkat","Follow device")+'</option><option value="light"'+(st.theme==="light"?" selected":"")+'>'+L("Terang","Light")+'</option><option value="dark"'+(st.theme==="dark"?" selected":"")+'>'+L("Gelap","Dark")+'</option></select></label></div>'+
   '<p class="hint">'+L("Semua total, grafik, dan anggaran ditampilkan dalam mata uang utama. Tiap transaksi tetap disimpan dalam mata uang aslinya.","All totals, charts and budgets are shown in your main currency. Each transaction keeps its original currency.")+'</p></section>'+
   '<section class="panel"><h3>'+L("Kurs mata uang","Exchange rates")+'</h3><div class="scroll"><table><tbody>'+rr+'</tbody></table></div><div class="row" style="margin-top:12px"><button class="btn ghost small" data-act="resetrates">'+L("Kembalikan kurs awal","Reset to default rates")+'</button></div><p class="hint">'+L("Kurs awal hanya perkiraan dan tidak diperbarui otomatis. Ubah angkanya sesuai kurs yang kamu pakai, perubahan langsung diterapkan ke semua total.","Default rates are approximate and do not update automatically. Edit them to the rates you use; changes apply to all totals immediately.")+'</p></section>'}
function guideHtml(){
  return '<section class="panel"><h3>'+L("Buku panduan","User guide")+'</h3><p class="hint" style="margin:-4px 0 6px">'+L("Ketuk judul untuk membuka penjelasannya.","Tap a title to open its explanation.")+'</p><div class="guide">'+
   GUIDE.map(function(g,i){return '<details'+(i===0?' open':'')+'><summary>'+esc(L(g[0],g[1]))+'</summary><div class="gb">'+L(g[2],g[3])+'</div></details>'}).join("")+'</div></section>'}
function renderSettings(){var st=S.data.settings,mc=st.main,tab=S.stab||"profil",au=S.auth||{hasPw:true,google:false};
  var tabs=[["profil","Profil","Profile"],["tampilan","Tampilan & kurs","Display & rates"],["panduan","Buku panduan","User guide"]];
  var h='<div class="subtabs" role="tablist">'+tabs.map(function(x){return '<button type="button" role="tab" data-stab="'+x[0]+'" aria-selected="'+(tab===x[0])+'">'+esc(L(x[1],x[2]))+'</button>'}).join("")+'</div>';
  h+=tab==="profil"?profilHtml(au):tab==="tampilan"?displayHtml(st,mc):guideHtml();
  $("#view").innerHTML=h;var av=$("#avbig");if(av)fillAv(av)}

/* ---------- Masuk dengan Google ---------- */
var GLOGO='<svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>';
function gmsg(){var web=/^https?:$/.test(location.protocol);
  if(!LOCAL)return L("Login Google belum diaktifkan di server ini. Admin perlu mengisi GOOGLE_CLIENT_ID (lihat README).","Google sign-in is not turned on for this server. The admin needs to set GOOGLE_CLIENT_ID (see README).");
  if(!S.gid)return L("Login Google belum diaktifkan. Isi GOOGLE_CLIENT_ID di bagian atas skrip halaman ini, lalu buka lewat alamat https (lihat README).","Google sign-in is not turned on. Set GOOGLE_CLIENT_ID at the top of this page's script and open it over https (see README).");
  if(!web)return L("Google hanya bisa dipakai jika halaman dibuka lewat alamat https, bukan dari file atau WhatsApp. Unggah halaman ini ke hosting atau jalankan server.py.","Google only works when the page is opened over https, not from a file or WhatsApp. Upload this page to a host or run server.py.");
  return ""}
function renderGoogle(){var box=$("#gbtn");if(!box)return;
  var m=gmsg();
  if(m){box.innerHTML='<button type="button" class="gfake" data-act="googleinfo">'+GLOGO+'<span>'+L("Masuk dengan Google","Continue with Google")+'</span></button><p class="hint" id="g-note" role="status" style="margin:0;text-align:center" hidden></p>';return}
  if(window.google&&google.accounts&&google.accounts.id){
    if(S.ginit!==S.gid){google.accounts.id.initialize({client_id:S.gid,callback:onGoogle,auto_select:false});S.ginit=S.gid}
    box.textContent="";google.accounts.id.renderButton(box,{theme:"outline",size:"large",shape:"pill",text:S.lmode==="up"?"signup_with":"signin_with",width:Math.min(320,box.clientWidth||320),locale:isEn()?"en":"id"});return}
  if(S.gsi)return;S.gsi=1;
  var s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";s.async=true;
  s.onload=function(){renderGoogle()};
  s.onerror=function(){S.gsi=0;var b=$("#gbtn");if(b)b.innerHTML='<p class="hint" style="margin:0">'+L("Tidak bisa memuat Google. Periksa koneksi internet.","Could not load Google. Check your internet connection.")+'</p>'};
  document.head.appendChild(s)}
function onGoogle(resp){var err=$("#l-err");
  api("POST","/api/google",{credential:resp&&resp.credential}).then(function(r){
    if(!r.ok){if(err)err.textContent=(r.json&&r.json.error)||L("Gagal masuk dengan Google.","Google sign-in failed.");return}
    startSession(r.json.email,r.json)},
   function(){if(err)err.textContent=L("Server tidak terjangkau.","Cannot reach the server.")})}

/* ---------- Masuk (server) ---------- */
var LOCAL=false;
/* Tanpa server.py: isi Client ID dari Google Cloud di sini agar tombol Google aktif (halaman harus dibuka lewat https). Dengan server.py, isi lewat variabel GOOGLE_CLIENT_ID di server. */
var GOOGLE_CLIENT_ID="";
function api(method,url,body){
  if(LOCAL)return localApi(method,url,body);
  return fetch(url,{method:method,credentials:"same-origin",headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined,keepalive:method==="PUT"&&body&&JSON.stringify(body).length<60000})
   .then(function(r){return r.json().catch(function(){return {}}).then(function(j){return {ok:r.ok,status:r.status,json:j}})})}
function showLogin(mode){S.email="";S.data=null;S.rev=0;if(mode)S.lmode=mode;S.lmode=S.lmode||"in";var reg=S.lmode==="up";
  document.documentElement.removeAttribute("data-theme");
  $("#app").hidden=true;$("#login").hidden=false;$("#toast").hidden=true;
  $("#login").innerHTML='<div class="login"><div class="brand" style="padding:0"><span class="logo" aria-hidden="true"></span><h1>MyFinansial</h1></div><section class="panel"><div class="seg" style="margin-bottom:14px"><button type="button" data-mode="in" aria-pressed="'+!reg+'">'+L("Masuk","Sign in")+'</button><button type="button" data-mode="up" aria-pressed="'+reg+'">'+L("Daftar","Sign up")+'</button></div>'+
   '<p style="margin-bottom:12px">'+(reg?L("Buat akun untuk menyimpan catatan keuanganmu di server ini.","Create an account to keep your finances on this server."):L("Masuk untuk membuka catatanmu dari perangkat mana pun.","Sign in to open your records from any device."))+'</p>'+
   '<form id="loginform"><label class="f">Email<input type="email" id="l-email" autocomplete="email" required value="'+esc(S.lemail||"")+'" placeholder="nama@email.com"></label><label class="f">'+L("Kata sandi","Password")+'<input type="password" id="l-pass" autocomplete="'+(reg?"new-password":"current-password")+'" required minlength="6"></label>'+
   '<div class="row"><button class="btn" type="submit">'+(reg?L("Buat akun","Create account"):L("Masuk","Sign in"))+'</button><span class="err" id="l-err" role="alert"></span></div></form>'+
   '<div class="or"><span>'+L("atau","or")+'</span></div><div id="gbtn" class="gbtn"></div>'+'<div class="row" style="margin-top:14px"><button class="btn ghost small" type="button" data-act="prelang">'+(S.pre==="en"?"Bahasa Indonesia":"English")+'</button></div>'+
   '<p class="hint">'+(LOCAL?L("Mode lokal: akun dan data hanya tersimpan di browser ini. Gunakan cadangan JSON untuk memindahkan data.","Local mode: accounts and data live only in this browser. Use a JSON backup to move your data."):L("Lupa kata sandi? Admin server bisa menggantinya dengan perintah resetpw.","Forgot your password? The server admin can reset it with the resetpw command."))+'</p></section></div>';renderGoogle()}
function startSession(email,extra){S.email=email;S.openDel=null;S.q="";S.stab="profil";
  return Promise.all([api("GET","/api/me"),api("GET","/api/data")]).then(function(a){var me=a[0],r=a[1];
    if(!r.ok){showLogin("in");return}
    S.auth={hasPw:me.ok?me.json.hasPw!==false:true,google:!!(me.ok&&me.json.google)};
    S.rev=r.json.rev||0;S.data=r.json.data?normData(r.json.data):defaultData2();var ch=false;
    if(extra&&extra.name&&!S.data.me.name){S.data.me.name=String(extra.name).slice(0,60);ch=true}
    if(extra&&extra.picture&&!S.data.me.avatar&&okAvatar(extra.picture)){S.data.me.avatar=extra.picture;ch=true}
    $("#login").hidden=true;$("#app").hidden=false;readHash();render();if(!r.json.data||ch)persist()})}
function logout(){clearTimeout(saveT);persist();var n=0;(function w(){if((saving||dirty)&&n++<30)return setTimeout(w,100);api("POST","/api/logout",{}).then(function(){S.lmode="in";showLogin()})})()}
function submitLogin(e){e.preventDefault();var email=$("#l-email").value.trim().toLowerCase(),pass=$("#l-pass").value,err=$("#l-err");err.textContent="";S.lemail=email;
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){err.textContent=L("Masukkan email yang valid.","Enter a valid email.");return}
  if(pass.length<6){err.textContent=L("Kata sandi minimal 6 karakter.","Password needs at least 6 characters.");return}
  api("POST",S.lmode==="up"?"/api/register":"/api/login",{email:email,password:pass}).then(function(r){
    if(!r.ok){err.textContent=(r.json&&r.json.error)||L("Gagal masuk","Could not sign in");return}
    startSession(r.json.email)},function(){err.textContent=L("Server tidak terjangkau.","Cannot reach the server.")})}
function defaultData2(){var d=normData(null);d.settings.lang=S.pre==="en"?"en":"id";return d}

/* ---------- Simpan ke server ---------- */
var saving=false,dirty=false;
function persist(sync){if(!S.email||!S.data)return;dirty=true;if(saving)return;
  saving=true;dirty=false;
  api("PUT","/api/data",{data:S.data,rev:S.rev}).then(function(r){saving=false;
    if(r.ok){S.rev=r.json.rev;if(dirty)persist();return}
    if(r.status===409){dirty=false;S.rev=r.json.rev;if(r.json.data){S.data=normData(r.json.data);render()}toast(L("Data diubah di perangkat lain, tampilan dimuat ulang.","Data changed on another device, view reloaded."));return}
    if(r.status===401){toast(L("Sesi berakhir, silakan masuk lagi.","Session expired, please sign in again."));showLogin("in");return}
    dirty=true;toast(L("Gagal menyimpan, mencoba lagi nanti.","Could not save, will retry."))},
   function(){saving=false;dirty=true;toast(L("Offline, perubahan belum tersimpan.","Offline, changes not saved yet."))})}
function syncFromServer(){if(!S.email||saving||dirty)return;
  api("GET","/api/data").then(function(r){if(r.ok&&r.json.rev>S.rev&&r.json.data&&!dirty&&!saving){S.rev=r.json.rev;S.data=normData(r.json.data);render()}})}
function saveFile(name,data){var ext=name.split(".").pop(),types={pdf:"application/pdf",xlsx:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",csv:"text/csv;charset=utf-8",json:"application/json"};
  var b=data instanceof Blob?data:new Blob([data],{type:types[ext]||"application/octet-stream"});var u=URL.createObjectURL(b),a=document.createElement("a");
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000);toast(L("File diunduh: ","File downloaded: ")+name)}

/* ---------- Mode lokal (tanpa server): meniru API di localStorage ---------- */
var mem={};
function lget(k){try{return localStorage.getItem(k)}catch(e){return mem[k]==null?null:mem[k]}}
function lset(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}
function ldel(k){try{localStorage.removeItem(k)}catch(e){delete mem[k]}}
function jwtClaims(t){try{var p=String(t).split(".")[1].replace(/-/g,"+").replace(/_/g,"/");while(p.length%4)p+="=";var b=atob(p),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return JSON.parse(new TextDecoder().decode(u))}catch(e){return null}}
function localApi(method,url,body){
  var users={};try{users=JSON.parse(lget("mf3:users")||"{}")||{}}catch(e){}
  function res(st,j){return Promise.resolve({ok:st<300,status:st,json:j})}
  var me=lget("mf3:session");if(me&&!users[me])me=null;
  if(url==="/api/me")return me?res(200,{email:me,hasPw:!users[me].nopw,google:!!users[me].g}):res(401,{error:"belum masuk"});
  if(url==="/api/google"){var gc=jwtClaims(body.credential);
    if(!S.gid||!gc||gc.aud!==S.gid||["accounts.google.com","https://accounts.google.com"].indexOf(gc.iss)<0||!(Number(gc.exp)>Date.now()/1000)||String(gc.email_verified)!=="true"||!gc.email)return res(401,{error:"token Google tidak valid"});
    var ge=String(gc.email).toLowerCase();if(!users[ge])users[ge]={h:"",s:"",nopw:true};users[ge].g=1;lset("mf3:users",JSON.stringify(users));lset("mf3:session",ge);
    var gp=String(gc.picture||"");if(!/^https:\/\/[a-z0-9.-]+\.googleusercontent\.com\//.test(gp))gp="";
    return res(200,{email:ge,name:String(gc.name||"").slice(0,60),picture:gp})}
  if(url==="/api/password"){if(!me)return res(401,{error:"belum masuk"});var u2=users[me],old=String(body.old||""),nw=String(body.new||"");if(nw.length<6)return res(400,{error:"kata sandi baru minimal 6 karakter"});
    return (u2.nopw?Promise.resolve(u2.h):sha(u2.s+old)).then(function(h1){if(h1!==u2.h)return {ok:false,status:401,json:{error:"kata sandi lama salah"}};var s2=uid();return sha(s2+nw).then(function(h2){users[me]={h:h2,s:s2,g:u2.g};lset("mf3:users",JSON.stringify(users));return {ok:true,status:200,json:{ok:true}}})})}
  if(url==="/api/logout"){ldel("mf3:session");return res(200,{ok:true})}
  if(url==="/api/register"||url==="/api/login"){var email=String(body.email||"").trim().toLowerCase(),pw=String(body.password||"");
    if(url==="/api/register"){
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return res(400,{error:"email tidak valid"});
      if(pw.length<6)return res(400,{error:"kata sandi minimal 6 karakter"});
      if(users[email])return res(409,{error:"email sudah terdaftar"});
      var salt=uid();return sha(salt+pw).then(function(h){users[email]={h:h,s:salt};lset("mf3:users",JSON.stringify(users));lset("mf3:session",email);return {ok:true,status:200,json:{email:email}}})}
    var u=users[email];if(!u)return res(401,{error:"email atau kata sandi salah"});
    return sha(u.s+pw).then(function(h){if(h!==u.h)return {ok:false,status:401,json:{error:"email atau kata sandi salah"}};lset("mf3:session",email);return {ok:true,status:200,json:{email:email}}})}
  if(url==="/api/data"){if(!me)return res(401,{error:"belum masuk"});
    var raw=lget("mf3:data:"+me),cur=raw?JSON.parse(raw):{data:null,rev:0};
    if(method==="GET")return res(200,cur);
    if(body.rev!==cur.rev)return res(409,{error:"konflik",rev:cur.rev,data:cur.data});
    lset("mf3:data:"+me,JSON.stringify({data:body.data,rev:cur.rev+1}));return res(200,{rev:cur.rev+1})}
  return res(404,{error:"tidak ditemukan"})}

/* ---------- Event ---------- */
document.addEventListener("click",function(e){var t=e.target.closest("button");if(!t)return;
  if(t.dataset.mode){S.lmode=t.dataset.mode;S.lemail=($("#l-email")||{}).value||S.lemail;showLogin();return}
  if(t.dataset.tab){setTab(t.dataset.tab);return}
  if(t.dataset.stab){S.stab=t.dataset.stab;renderSettings();return}
  if(t.dataset.key){keyPress(t.dataset.key);return}
  if(t.dataset.type&&t.closest("#txform")){S.type=t.dataset.type;$$("#txform .seg button").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.type===S.type))});fillCats();return}
  if(t.dataset.del){var id=t.dataset.del;if(S.openDel===id){S.openDel=null;S.data.tx=S.data.tx.filter(function(x){return x.id!==id});persist();renderTxTable();toast(L("Transaksi dihapus","Transaction deleted"))}else{S.openDel=id;renderTxTable()}return}
  if(t.dataset.rmacc){var aid=t.dataset.rmacc,key="acc:"+aid;
    if(S.data.accounts.length<2){toast(L("Minimal satu rekening harus ada","At least one account must remain"));return}
    if(S.data.tx.some(function(x){return x.acc===aid})||S.data.transfers.some(function(x){return x.from===aid||x.to===aid})){toast(L("Rekening ini sudah dipakai transaksi atau transfer","This account is used by transactions or transfers"));return}
    if(S.openDel===key){S.openDel=null;S.data.accounts=S.data.accounts.filter(function(x){return x.id!==aid});persist();renderAcc()}else{S.openDel=key;renderAcc()}return}
  if(t.dataset.rmtf){var tid=t.dataset.rmtf,k2="tf:"+tid;if(S.openDel===k2){S.openDel=null;S.data.transfers=S.data.transfers.filter(function(x){return x.id!==tid});persist();renderAcc()}else{S.openDel=k2;renderAcc()}return}
  if(t.dataset.preset){S.data.profile.pots=PRESETS[t.dataset.preset].map(function(x,i){return {id:"p"+uid()+i,name:x[0],pct:x[1],c:i+1}});queueSave();renderSplit();return}
  if(t.dataset.rmpot){S.data.profile.pots=S.data.profile.pots.filter(function(p){return p.id!==t.dataset.rmpot});queueSave();renderSplit();return}
  switch(t.dataset.act){
    case "prev":S.month=shiftMonth(S.month,-1);render();break;
    case "next":S.month=shiftMonth(S.month,1);render();break;
    case "thismonth":S.month=todayStr().slice(0,7);render();break;
    case "samples":addSamples();break;case "rmsamples":rmSamples();break;
    case "togglecalc":S.calcOpen=!S.calcOpen;renderTx();break;
    case "xlsx":exportXlsx();break;case "csv":exportCsv();break;case "pdf":exportPdf();break;case "backup":backup();break;
    case "restore":S.restoreMode="merge";$("#restorefile").click();break;
    case "prelang":S.pre=S.pre==="en"?"id":"en";S.lemail=($("#l-email")||{}).value||S.lemail;showLogin();break;
    case "logout":logout();break;case "logsalary":logSalary();break;
    case "googleinfo":var gn=$("#g-note");if(gn){gn.textContent=gmsg();gn.hidden=false}break;
    case "pickavatar":$("#avatarfile").click();break;
    case "rmavatar":S.data.me.avatar="";persist();renderChrome();renderSettings();break;
    case "resetrates":S.data.settings.rates=Object.assign({},DEFRATES);persist();renderSettings();toast(L("Kurs dikembalikan","Rates reset"));break;
    case "addpot":if(S.data.profile.pots.length>=8){toast(L("Maksimal 8 pos","Maximum 8 pots"));break}S.data.profile.pots.push({id:"p"+uid(),name:L("Pos baru","New pot"),pct:0,c:newPotColor()});queueSave();renderSplit();break}
});
document.addEventListener("input",function(e){var t=e.target;
  if(t.id==="p-name"){S.data.me.name=t.value.slice(0,60);queueSave();renderChrome();var avb=$("#avbig");if(avb)fillAv(avb);return}
  if(t.id==="f-amount"){updCalcRes();return}
  if(t.id==="q"){S.q=t.value;renderTxTable();return}
  if(t.id==="t-amt"||t.id==="t-amt2"){updTfRes();return}
  if(t.id==="salary"){fmtField(t);var v=numIn(t.value);S.data.profile.salary=v>0?v:0;delete S.data.profile.sampleSalary;queueSave();renderAlloc();return}
  var row=t.closest&&t.closest(".pot");if(!row)return;
  var p=S.data.profile.pots.filter(function(x){return x.id===row.dataset.id})[0];if(!p)return;
  if(t.classList.contains("nm"))p.name=t.value;else if(t.classList.contains("pc"))p.pct=Math.max(0,Math.min(100,Number(t.value)||0));
  queueSave();renderAlloc()});
document.addEventListener("change",function(e){var t=e.target;
  if(t.id==="avatarfile"){var af=t.files[0];t.value="";pickAvatar(af);return}
  if(t.id==="f-cur"){updCalcRes();return}
  if(t.id==="ftype"){S.fType=t.value;renderTxTable();return}
  if(t.id==="t-from"||t.id==="t-to"){updTfRes();return}
  if(t.id==="s-lang"){S.data.settings.lang=t.value;persist();render();return}
  if(t.id==="s-main"){S.data.settings.main=t.value;persist();render();return}
  if(t.id==="s-theme"){S.data.settings.theme=t.value;persist();render();return}
  if(t.dataset&&t.dataset.rate){var c=t.dataset.rate,v=numIn(t.value);if(!(v>0)){toast(L("Kurs tidak valid","Invalid rate"));renderSettings();return}
    S.data.settings.rates[c]=v*S.data.settings.rates[S.data.settings.main];persist();t.value=fmtRate(v);toast(L("Kurs diperbarui","Rate updated"))}});
document.addEventListener("submit",function(e){var id=e.target.id;
  if(id==="pwform")submitPw(e);else if(id==="txform")submitTx(e);else if(id==="accform")submitAcc(e);else if(id==="tfform")submitTf(e);else if(id==="loginform")submitLogin(e)});
window.addEventListener("hashchange",function(){if(S.email){readHash();render()}});
window.addEventListener("pagehide",function(){clearTimeout(saveT);persist()});
$("#restorefile").addEventListener("change",function(e){var f=e.target.files[0];e.target.value="";
  readBackup(f,function(o){
    if(S.email)restoreInto(o)})});

/* ---------- Mulai ---------- */
S.pre=(navigator.language||"id").toLowerCase().indexOf("id")===0?"id":"en";
function boot(r){if(r.ok)startSession(r.json.email);else showLogin("in")}
fetch("/api/me",{credentials:"same-origin"}).then(function(r){if(!/json/.test(r.headers.get("content-type")||""))throw 0;return r.json().then(function(j){
  return fetch("/api/config",{credentials:"same-origin"}).then(function(c){return c.json()}).then(function(c){S.gid=String(c.google||"")},function(){}).then(function(){boot({ok:r.ok,json:j})})})}).catch(function(){LOCAL=true;S.gid=GOOGLE_CLIENT_ID;localApi("GET","/api/me").then(boot)});
window.addEventListener("online",function(){if(dirty)persist()});
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"){if(dirty)persist();else syncFromServer()}});
})();
